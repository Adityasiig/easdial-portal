services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easdial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easdial}
      POSTGRES_DB: ${POSTGRES_DB:-easdial_portal}
    # No host port publish — the backend reaches the DB via the internal "db"
    # network alias. Publishing 5432 clashes on shared hosts (e.g. Coolify).
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easdial}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-easdial}:${POSTGRES_PASSWORD:-easdial}@db:5432/${POSTGRES_DB:-easdial_portal}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      # Public URL of the FRONTEND — the backend only accepts CORS from this origin.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:5173}
      # Peeredge data source
      PEEREDGE_SOURCE: ${PEEREDGE_SOURCE:-mock}
      PEEREDGE_BASE_URL: ${PEEREDGE_BASE_URL:-https://api-dialphone.peeredge.com}
      PEEREDGE_ORIGIN: ${PEEREDGE_ORIGIN:-https://carrier-dialphone.peeredge.com}
      PEEREDGE_AUTH_MODE: ${PEEREDGE_AUTH_MODE:-cookie}
      PEEREDGE_SESSION_COOKIE: ${PEEREDGE_SESSION_COOKIE:-}
      PEEREDGE_LOGIN_URL: ${PEEREDGE_LOGIN_URL:-}
      PEEREDGE_EMAIL: ${PEEREDGE_EMAIL:-}
      PEEREDGE_PASSWORD: ${PEEREDGE_PASSWORD:-}
    # Coolify's proxy routes the backend domain to this port internally.
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes this at BUILD time, so it must be a build arg (not runtime env).
        # Set it to the backend's PUBLIC URL in Coolify.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    # Coolify's proxy routes the frontend domain to this port internally.
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  pgdata:
